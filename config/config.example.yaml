# Hermes Agent Configuration — Reference
# https://github.com/kevinyosef/hermes-configs
#
# ⚠️ YOU DO NOT NEED TO EDIT THIS FILE MANUALLY.
#
# The recommended setup uses interactive commands:
#   hermes model       → configures your LLM provider & API key
#   hermes gateway setup → connects Telegram
#
# This file is a REFERENCE showing available options.
# Only edit it directly if you know what you're doing.

# === LLM PROVIDER (set via `hermes model`) ===

# provider: opencode
# model: deepseek-v4-flash-free  # Free tier
# opencode_api_key: "sk-..."

# === TELEGRAM BOT (set via `hermes gateway setup`) ===

# telegram:
#   bot_token: "123456:ABC-DEF..."
#   allowed_user_id: ""

# === WORKFLOW SETTINGS (copy the prompts from /workflows/) ===

# These are the schedule defaults for each workflow.
# Import them into your Hermes cron config after gateway setup.

workflows:
  morning_anchor:
    enabled: true
    time: "07:00"
    timezone: "Africa/Nairobi"

  daily_checkin:
    enabled: true
    time: "20:00"
    timezone: "Africa/Nairobi"

  evening_winddown:
    enabled: true
    time: "21:30"
    timezone: "Africa/Nairobi"

# === STORAGE ===

# data_dir: "./data"

